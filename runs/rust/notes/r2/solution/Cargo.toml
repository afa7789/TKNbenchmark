[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "notes"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
form_urlencoded = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
