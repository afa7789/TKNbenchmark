[package]
name = "kvhttp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
