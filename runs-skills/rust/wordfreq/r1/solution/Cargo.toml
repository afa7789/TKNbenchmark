[package]
name = "wordfreq"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "wordfreq"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
