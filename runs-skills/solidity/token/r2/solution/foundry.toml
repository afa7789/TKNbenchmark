[profile.default]
src = "src"
out = "forge-out"
libs = ["lib"]
solc = "0.8.39"
optimizer = true
optimizer_runs = 200
deny = "warnings"
ignored_warnings_from = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000
seed = "0x1"
