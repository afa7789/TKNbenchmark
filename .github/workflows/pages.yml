name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Separate build and deploy jobs (GitHub's reference layout): deploying from the same job that
  # uploaded the artifact intermittently failed with "No artifacts named github-pages were found".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Pages serves every file with max-age=600 and no way to change it: version the page's assets
      # by commit so a new index.html never runs with a cached style.css / a11y.js / app.js.
      - name: Version assets
        run: |
          sed -i -E "s/(href|src)=\"(style\.css|a11y\.js|app\.js)\"/\1=\"\2?v=${GITHUB_SHA::8}\"/" public/index.html
          test "$(grep -c "?v=${GITHUB_SHA::8}" public/index.html)" -eq 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
