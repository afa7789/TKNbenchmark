[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = "0.8"
r2d2 = "0.8.10"
r2d2_sqlite = "0.37.2"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"

[profile.release]
lto = "thin"
codegen-units = 1
