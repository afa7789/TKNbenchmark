[package]
name = "kvhttp"
version = "0.1.0"
edition = "2024"
description = "A minimal in-memory HTTP/1.1 key-value server"
publish = false

[dependencies]
bytes = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
