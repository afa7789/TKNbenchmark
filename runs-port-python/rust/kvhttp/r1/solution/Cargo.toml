[package]
name = "kvhttp"
version = "0.1.0"
edition = "2024"
description = "A small in-memory HTTP/1.1 key-value server"
publish = false

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }

[profile.release]
lto = true
codegen-units = 1
